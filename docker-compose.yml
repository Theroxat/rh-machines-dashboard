services:
  rh-dashboard:
    build: .
    container_name: rh-dashboard
    restart: unless-stopped
    env_file: .env
    # 3050 a été vérifié libre sur cet hôte, et n'est déclaré par aucun autre
    # conteneur, en marche ou arrêté. L'écoute est liée à 192.168.0.11 plutôt
    # qu'à 0.0.0.0 : le dashboard reste sur l'interface LAN.
    ports:
      - "192.168.0.11:3050:3050"
    volumes:
      - ./data:/app/data

  # ── Le banc d'essai ────────────────────────────────────────────────────────
  #
  # La prod a des visiteurs. Reconstruire son conteneur pour éprouver une idée
  # la coupe cinquante-six secondes — dont vingt-cinq où rien n'écoute et où le
  # tunnel rend une erreur de connexion. Vingt déploiements dans un après-midi
  # font vingt minutes de site mort pour du travail qui n'était pas encore prêt
  # à être vu.
  #
  # Le banc tourne sur le même code, sur un port à lui (3051, vérifié libre sur
  # cet hôte, y compris parmi les conteneurs arrêtés), et n'est pas exposé par
  # le tunnel. On y déploie autant qu'on veut.
  #
  # Trois différences avec la prod, et elles sont délibérées :
  #   - sa propre base d'historique, pour ne pas écrire dans celle qui sert ;
  #   - aucun webhook Discord, pour ne pas sonner chez le porteur à chaque essai ;
  #   - pas de redémarrage automatique : un banc mort ne doit alerter personne.
  rh-dashboard-staging:
    build: .
    container_name: rh-dashboard-staging
    profiles: ["staging"]
    restart: "no"
    env_file: .env
    environment:
      DISCORD_WEBHOOK: ""
    ports:
      - "192.168.0.11:3051:3050"
    volumes:
      - ./data-staging:/app/data

  # ── L'ancienne version ─────────────────────────────────────────────────────
  #
  # Gardée en ligne le temps de savoir laquelle les gens préfèrent. Ce n'est
  # pas une branche qu'on développe : l'image est construite depuis la branche
  # `legacy` — l'état d'avant la refonte, plus le lien de retour vers la version
  # actuelle, et rien d'autre. `build` est volontairement absent
  # — un `up --build` sur ce fichier ne doit pas la remplacer par le code
  # d'aujourd'hui, ce qui ferait servir la nouvelle version aux deux adresses
  # sans que rien ne le signale.
  #
  #   git archive legacy | docker build -t rh-dashboard:legacy -
  #
  # Deux différences avec la prod, délibérées :
  #   - sa propre base d'historique : deux services écrivant dans la même se
  #     marcheraient dessus, et c'est celle du site qui sert qui y perdrait ;
  #   - aucun webhook : un seul service notifie, sinon chaque annonce sonne
  #     deux fois et on ne sait plus laquelle des deux versions l'a envoyée.
  #
  # 3052 a été vérifié libre sur cet hôte — écoutes réelles comprises, pas
  # seulement les ports déclarés par des conteneurs.
  rh-dashboard-legacy:
    image: rh-dashboard:legacy
    container_name: rh-dashboard-legacy
    profiles: ["legacy"]
    restart: unless-stopped
    env_file: .env
    environment:
      DISCORD_WEBHOOK: ""
    ports:
      - "192.168.0.11:3052:3050"
    volumes:
      - ./data-legacy:/app/data
